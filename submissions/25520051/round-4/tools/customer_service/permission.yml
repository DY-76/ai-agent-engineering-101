name: customer_service
description: v46 customer_service를 지정된 문장 분리·제외어·규격 점수 패치로 감싸 실행하고, 요청 조건에 따라 A등급만으로 조회합니다. 기존 customer_service와 같은 인자를 받습니다.
permission:
  network: [market.ourolabs.ai]
  write: [inquiries.jsonl, offers.json]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 60
  handles: [a2a]
logic: logic.py
test: test.py
version: 47
replaces: customer_service@46
