name: customer_service
description: 실제 재고·카탈로그 및 원장으로 상품 문의·checkout을 처리하고 첫구매/추천/흥정 할인을 적용합니다. args: {text, data, claimed_from, task_id, context_id, history}.
permission:
  network: [market.ourolabs.ai]
  write: [offers.json]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 60
  handles: [a2a]
logic: logic.py
test: test.py
version: 8
replaces: customer_service@7
