name: customer_service
description: 회원·재고 문의를 정식 가격표에 따라 처리합니다. args: {text, claimed_from, history, task_id, context_id}. SKU가 카탈로그에만 있고 재고에는 없으면 품절 안내를 반환합니다.
permission:
