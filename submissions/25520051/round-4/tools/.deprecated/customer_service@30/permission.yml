name: customer_service
description: 기존 customer_service 실행 후 상품명 불일치 오배송 결제서를 차단
permission:
  network: [market.ourolabs.ai]
  write: [inquiries.jsonl, offers.json]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 180
  handles: [a2a]
logic: logic.py
test: test.py
version: 30
replaces: customer_service@29
