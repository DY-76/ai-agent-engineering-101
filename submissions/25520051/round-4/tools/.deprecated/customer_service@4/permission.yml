name: customer_service
description: 실제 카탈로그와 재고를 조회해 상품 문의·흥정·구매를 응대하고, 회원 장부에 문의와 미확정 체크아웃을 기록하며, 청산소 규격 checkout_jwt를 반환합니다. args: {text,data,claimed_from,task_id,context_id,history}
permission:
  network: [market.ourolabs.ai, sic-extending-applying-game.trycloudflare.com]
  write: [ledger.json]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 30
  handles: [a2a]
logic: logic.py
test: test.py
version: 4
replaces: customer_service@3
