name: customer_service
description: 실제 재고와 카탈로그를 조회해 상품 문의에 응답하고, 구매 의사에는 현재 등급으로 checkout_jwt를 발급합니다. args: {text, data, claimed_from, task_id, context_id, history}.
permission:
  network: [market.ourolabs.ai]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 60
  handles: [a2a]
logic: logic.py
test: test.py
version: 6
replaces: customer_service@5
