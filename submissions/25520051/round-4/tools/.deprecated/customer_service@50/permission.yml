name: customer_service
description: 기존 customer_service v49 동작을 유지하면서, 손님이 말한 가격과 일치하는 재고를 우선 선택합니다. 기존 인자와 응답 규격을 사용합니다.
permission:
  network: [market.ourolabs.ai]
  write: [inquiries.jsonl, offers.json, buyers.json]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 60
  handles: [a2a]
logic: logic.py
test: test.py
version: 50
replaces: customer_service@49
