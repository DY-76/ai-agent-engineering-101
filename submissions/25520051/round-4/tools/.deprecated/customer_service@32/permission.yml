name: customer_service
description: 회원·재고 문의에 실제 재고와 정해진 가격으로 응대하고, 구매 요청에는 checkout_jwt를 data로 반환합니다. args: {text, claimed_from, history, task_id, context_id}.
permission:
  network: [market.ourolabs.ai]
  write: [inquiries.jsonl, offers.json]
  identity: [shop]
  wallet: [sign_jwt]
  timeout: 60
  handles: [a2a]
logic: logic.py
test: test.py
version: 32
replaces: customer_service@31
