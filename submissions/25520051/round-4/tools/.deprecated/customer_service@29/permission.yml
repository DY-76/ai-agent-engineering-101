name: customer_service
description: 기존 customer_service 원본을 실행하되 한국어 연결 조사 일부를 정리한 회원 고객응대 도구
permission:
  network: [market.ourolabs.ai]
  write: [inquiries.jsonl, offers.json]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 180
  handles: [a2a]
logic: logic.py
test: test.py
version: 29
replaces: customer_service@28
