name: customer_service
description: 회원·재고 문의에 규격대로 한국어 안내를 제공하고, 구매 요청에는 실제 재고의 checkout_jwt를 발급합니다. args: {text, claimed_from, history, task_id, context_id}.
permission:
  network: [market.ourolabs.ai]
  write: [inquiries.jsonl, offers.json]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 60
  handles: [a2a]
logic: logic.py
test: test.py
version: 31
replaces: customer_service@30
