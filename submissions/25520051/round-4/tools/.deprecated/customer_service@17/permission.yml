name: customer_service
description: v14 기반 고객 응대 도구에서 8팩 매칭 오류와 잘못된 어묵 임박 문구를 수정하고, 실제 임박 재고 가격을 계산해 checkout_jwt를 발급합니다. args: text, claimed_from
permission:
  network: [market.ourolabs.ai]
  write: [inquiries.jsonl, offers.json]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 180
  handles: [a2a]
logic: logic.py
test: test.py
version: 17
replaces: customer_service@16
