name: customer_service
description: 실제 카탈로그·재고를 조회하고 회원 장부를 갱신하며, 상품 문의에는 재고·가격을 안내하고 구매 요청에는 청산소 형식의 가게 서명 checkout_jwt를 data로 반환합니다. args: {text,data,claimed_from,task_id,context_id,history}
permission:
  network: [market.ourolabs.ai, sic-extending-applying-game.trycloudflare.com]
  write: [ledger.json]
  identity: [shop]
  wallet: [sign, sign_jwt]
  pay_limit: 0
  timeout: 30
  handles: [a2a]
logic: logic.py
test: test.py
version: 3
replaces: customer_service@2
