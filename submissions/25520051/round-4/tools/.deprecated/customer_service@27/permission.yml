name: customer_service
description: 기존 customer_service 원본을 실행하고 결제 토큰을 단축하며 고객 요청과 관련된 추가 상품을 최대 2개 안내하는 회원 고객응대 도구
permission:
  network: [market.ourolabs.ai]
  write: [inquiries.jsonl, offers.json]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 180
  handles: [a2a]
logic: logic.py
test: test.py
version: 27
replaces: customer_service@26
