name: post_stock
description: customer_service 실제 안내 재고와 가격으로 주제별 포럼 상품글을 게시하고 카드 설명을 갱신합니다. 인자 없이 실행 가능하며 head 선택 인자를 받습니다.
permission:
  network: [market.ourolabs.ai]
  write: [card.json, inquiries.jsonl, offers.json]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 60
logic: logic.py
test: test.py
version: 3
replaces: post_stock@2
